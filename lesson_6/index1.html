<!DOCTYPE html>
<html>
    <head>
        <title>DOCTOR APPOINTMENT</title>

    </head>
    <body>
        <h1>MY DOCTOR APPOINTMENT</h1>
        <p>Fill in the form to book your appointment </p>
        <hr>
        <form>
            <fieldset>
                <legend>Personal Details</legend>
                <label>Your Name</label>
                <input type="text" placeholder="Enter your name">
                <br><br>

                <label>Patient ID</label>
                <input type="Password" placeholder="Enter your ID">
                <br><br>

                <label>Date of Birth</label>
                <input type="Date">
                <br>

            </fieldset>
            <fieldset>
                <legend>Your visit</legend>
                <label>choose your doctor</label>
                <select>
                    <option>Select your doctor</option>
                    <option>DR. Sharma</option>
                    <option>DR. Jha</option>
                    <option>DR.gupta</option>
                </select>
                <br><br>
                <label>Reason</label><br>
                <input type="radio">fever<br>
                <input type="radio">cold<br>
                <input type="radio">check up<br>
                <input type="radio">tooth pain<br>
                <br>
            </fieldset>
            <fieldset>
                <legend>preferred visit day</legend>
                
                
                <br><br>
                <label>days</label><br>
                <input type="checkbox">wednesday<br>
                <input type="checkbox">saturday<br>
                <input type="checkbox">sunday<br>
                <input type="checkbox">friday<br>
                <br>
            </fieldset>
            <br>
            <button>submit</button>
            
        </form>
    </body>
</html>
