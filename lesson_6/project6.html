<!DOCTYPE html>
<html>
    <head>
        <title>BOOK DONATION FORM</title>

    </head>
    <body>
        <h1>BOOK DONATION</h1>
        <p>Fill in this form to donate books</p>
        <hr>
        <form>
            <fieldset>
                <legend>DONOR DETAILS</legend>
                <label>Your Name</label><br>
                <input type="text" placeholder="Enter your full name">

                <br><br>
                <label>Donor ID</label><br>
                <input type="password Password" placeholder="Donor ID">
                <br>
                <br>
                <label>Date of BIRTH</label><br>
                <input type="date">
                <br> <br>

            </fieldset>
            <br><br>
            <fieldset>
                <legend>BOOK DETAILS</legend>
                <label>Book Category</label>
                <select>
                    <option>Select Book Category</option>
                    <option>fictional</option>
                    <option>comedy</option>
                    <option>action</option>
                    <option>thrillers</option>
                </select>
                <br>
                <br>
                <label>Book Condition</label><br>
                <input type="radio">like new<br>
                <input type="radio">good<br>
                <input type="radio">used<br>
                <br>


            </fieldset>
            <fieldset>
                <legend>Preferred Drop off day</legend>
                <input type="checkbox">MONDAY<br>
                <input type="checkbox">WEDNESDAY<br>
                <input type="checkbox">FRIDAY<br>
                <br>
            </fieldset>
            <br>
            <button>SUBMIT</button>
        </form>
    </body>
</html>
